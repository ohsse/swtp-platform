# p6spy 로깅 설정
# appender를 Slf4JLogger로 고정해 SLF4J(Logback)를 거치게 한다 — 기본 SystemOutLogger는
# 로거를 우회한 raw stdout이라 레벨 제어가 불가능하고 구조화 로깅(ECS)에도 실리지 않는다.
# 로거명은 'p6spy' — logging.level.p6spy 로 온오프/레벨을 제어한다 (앱 application.yml에서 재정의).
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory
appender=com.p6spy.engine.spy.appender.Slf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(category) | %(sql)

# info/debug/result/resultset/commit/rollback 카테고리는 잡음이 많아 기본 제외 — 필요 시 앱이 재정의
excludecategories=info,debug,result,resultset,commit,rollback

# 오래 걸리는 쿼리를 outage 카테고리로 별도 경고 — 2초 이상
outagedetection=true
outagedetectioninterval=2
