# ems-service — 포트 고정표: 8087
server:
  port: 8087

spring:
  profiles:
    active: dev, micro
  application:
    name: ems-service
  config:
    # config-server 연동 — optional: 미가동 시에도 단독 기동 가능. 컨테이너에서는 CONFIG_SERVER_URI로 재지정
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  jpa:
    properties:
      hibernate.default_schema: ems
  flyway:
    # 스키마 소유권 규약 — 자기 스키마만 관리하고 history 테이블도 자기 스키마 안에 둔다.
    # 접속정보와 create-schemas: false는 config-repo/application.yml이 SSOT다.
    schemas: ems
    default-schema: ems
