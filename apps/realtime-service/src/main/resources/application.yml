# realtime-service — 포트 고정표: 8083
server:
  port: 8083

spring:
  profiles:
    active: dev, micro
  application:
    name: realtime-service
  config:
    # config-server 연동 — optional: 미가동 시에도 단독 기동 가능. 컨테이너에서는 CONFIG_SERVER_URI로 재지정
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

  kafka:
    bootstrap-servers: localhost:9092 # 브로커 포트는 전 환경 9092 — 컨테이너 간은 kafka:9092 (docker 프로파일에서 재정의)
    consumer:
      # 브로드캐스트는 과거 재생이 불필요 — 스타터 기본값(earliest)을 재정의한다
      auto-offset-reset: latest
