# config-server — 포트 고정표: 8888
server:
  port: 8888

spring:
  kafka:
    # 설정 전파(Config Bus)가 쓰는 브로커. config-server는 자기가 서빙하는 config-repo를
    # 자기는 읽지 않으므로(spring.config.import 없음) 이 값이 최종값이다 — 다른 앱처럼
    # config-repo에서 내려받지 못한다. 그래서 환경 차이를 환경변수로 흡수한다.
    # 브로커 포트는 전 환경 9092다 — 다른 것은 호스트명뿐이다.
    #   호스트 실행 : localhost:9092
    #   컨테이너    : kafka:9092 (compose.yaml의 config-server가 전달)
    # bus.destination은 지정하지 않는다 — 기본 토픽명(springCloudBus)을 쓴다.
    # 여기와 config-repo 양쪽에 적으면 두 값이 갈라졌을 때 발행 토픽과 수신 토픽이
    # 달라져 아무 에러 없이 리프레시가 사라진다.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # 리포지토리 루트에서 실행(java -jar, 컨테이너 마운트) 기준.
          # optional: 디렉토리가 없어도 기동은 가능하게 한다 (빈 저장소)
          search-locations: optional:file:./config-repo

management:
  endpoints:
    web:
      exposure:
        # prometheus는 step-16 함정 #2의 정정이다 — config-server만 이 목록이 닫혀 있어
        # scrape 타깃에 들어 있으면서도 메트릭이 나온 적이 없었다.
        # config-server는 spring.config.import가 없어 config-repo의 management 블록을
        # 받지 못한다. 그래서 같은 값을 여기에 따로 적는다.
        include: busrefresh, refresh, health, prometheus
  health:
    # config-repo/application.yml과 같은 이유 — 여기는 그 파일을 읽지 못해 따로 적는다.
    # config-server의 health는 compose 기동 체인의 뿌리다. 여기가 Kafka 때문에 DOWN이 되면
    # 다른 앱이 하나도 뜨지 못한다.
    binders:
      enabled: false