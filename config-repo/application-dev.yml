# dev 프로파일 — spring.kafka.bootstrap-servers는 여기서 재정의하지 않는다.
# 브로커 포트는 전 환경 9092로 통일돼 있고 그 값은 application.yml 공통에 있다.
# 프로파일마다 재정의하면 설정 전파(Config Bus)의 발행자와 수신자가 다른 브로커를 보게 된다.
# 인증 모드는 여기에 두지 않는다 — 공통 기본이 none이라 같은 값을 되풀이하는 것이고,
# 무엇보다 SWTP_AUTH_MODE 환경변수가 결정한다는 규약을 이 파일이 되돌려 놓게 된다.
# (예전에 mode: none을 리터럴로 두어 dev 프로파일에서만 환경변수가 무시됐다)
