# 스마트정수장 플랫폼 전체 스택 (Phase 5: 미들웨어 + 앱 컨테이너 통합)
# 사전 조건: 앱 이미지 빌드 전 호스트에서 `gradlew bootJar` 실행
#   Core 기동:        docker compose -f infrastructure/docker/compose.yaml up -d --build
#   Optional 포함:    docker compose -f infrastructure/docker/compose.yaml --profile pms --profile ai up -d --build
#   전체 기동:        docker compose -f infrastructure/docker/compose.yaml --profile full up -d --build
# Optional 프로파일(문서 19장 "정수장별 선택 배포"): auth / autonomous / pms / ai, 묶음: full
#   관측 백엔드:      docker compose -f infrastructure/docker/compose.yaml --profile elk up -d
#   elk는 앱 프로파일과 다른 축이라 full에 포함되지 않는다 — 함께 띄우려면 둘 다 지정한다.
#
# ── compose --profile과 SWTP_PROFILES는 별개다. 섞지 말 것 ────
#   compose --profile : 어떤 컨테이너를 띄울지 (auth/autonomous/pms/ai)
#   SWTP_PROFILES     : 어떤 설정을 읽을지 (Spring, config-repo/application-<프로파일>.yml)
# 인증 모드(swtp.auth.mode)는 x-app-env가 전달한다 — 기본은 none(검증하지 않음)이다.
# 자체 auth-service로 토큰을 검증하는 정수장만 .env에 SWTP_AUTH_MODE=internal을 적는다.
name: swtp-platform

# ── 앱 공통 조각 (YAML 앵커) ─────────────────────────────────
x-app-build: &app-build
  context: ../..
  dockerfile: infrastructure/docker/app.Dockerfile

x-app-env: &app-env
  CONFIG_SERVER_URI: http://config-server:8888
  # swtp.logging.path — 컨테이너 안 경로를 마운트 지점으로 고정한다
  SWTP_LOGGING_PATH: /logs
  # 콘솔 로그 포맷: plain(기본, 사람이 읽음) | ecs(수집기가 파싱하는 JSON 1줄).
  # 로그 수집 파이프라인을 운용하는 정수장만 .env에 ecs를 적는다.
  SWTP_LOG_FORMAT: ${SWTP_LOG_FORMAT:-plain}
  # 정수장 식별자 — ECS 로그의 service.node.name으로 나간다.
  # 중앙 집계로 전환할 때 "어느 정수장 로그인가"를 가르는 유일한 축이다.
  SWTP_SITE_CODE: ${SWTP_SITE_CODE:-}
  # 인증 검증 모드: none(기본, 인증을 앞단 포털·SSO가 끝내는 정수장) | internal(자체 토큰 검증).
  # 갈라진 두 앵커가 아니라 공통 베이스에 둔다 — 게이트웨이와 업무 서비스가 같은 값을
  # 같은 뜻으로 읽어야 하고, 두 곳에 적으면 그 순간 어긋날 수 있는 구조가 생긴다.
  SWTP_AUTH_MODE: ${SWTP_AUTH_MODE:-none}
  # 공개키(JWKS) 위치 — mode=internal일 때만 쓰인다. 기본값이 함께 배포하는(--profile auth)
  # auth-service를 가리키므로 그 구성이면 .env에 mode 한 줄만 적으면 된다.
  #
  # auth-service를 직접(auth-service:8085) 가리키지 않는다 — micro 프로파일이 server.port=0을
  # 주므로 컨테이너 안 실제 포트는 매 기동 달라진다. 컨테이너끼리는 Eureka로 찾는데 JWKS 조회는
  # NimbusReactiveJwtDecoder가 평범한 HTTP URI로 하므로 lb://를 쓸 수 없다. 그래서 게이트웨이를
  # 경유한다 — 게이트웨이가 Eureka로 대상을 찾고, 이 경로는 permit-all-paths라 토큰 없이 열린다.
  #
  # 빈 값으로 두지 않는다: 빈 문자열도 '존재하는 값'이라 앱 쪽 플레이스홀더 기본값이
  # 발동하지 않고, 파생되는 jwk-set-uri가 비어 JwtDecoder 빈 생성이 깨진다.
  SWTP_AUTH_JWKS_URI: ${SWTP_AUTH_JWKS_URI:-http://gateway:8080/auth-service/api/auth/.well-known/jwks.json}

x-platform-app-env: &platform-app-env
  <<: *app-env
  # gateway/discovery는 DB/Flyway/JPA가 없는 플랫폼 앱이므로 환경 축만 활성화한다.
  SPRING_PROFILES_ACTIVE: ${SWTP_PROFILES:-docker}

x-micro-app-env: &micro-app-env
  <<: *app-env
  # 업무 마이크로서비스는 환경 축에 micro 축을 항상 더해 DB/Flyway/JPA/랜덤 포트 설정을 받는다.
  SPRING_PROFILES_ACTIVE: ${SWTP_PROFILES:-docker},micro
  SWTP_DB_HOST: ${SWTP_DB_HOST:-timescaledb}
  SWTP_DB_PORT: ${SWTP_DB_PORT:-5432}

# 로그 파일은 bind mount — 호스트에서 직접 열람·반출하는 것이 목적이다 (감사·장애분석 백업).
# 수집기로 가는 경로는 stdout(ECS JSON) 단독이다 — 수집기는 이 디렉토리를 읽지 않는다(이중 적재 방지).
# 서비스별 하위 디렉토리(logs/<service>/)는 앱의 logback 설정이 만든다.
x-app-logs: &app-logs
  - ../../logs:/logs

x-depends-config: &depends-config
  config-server:
    condition: service_healthy

# 전 앱 공통 — auto-create off이므로 토픽 생성 완료를 보장한 뒤 기동한다.
# 도메인 이벤트를 쓰지 않는 앱도 설정 전파(Config Bus)로 springCloudBus를 구독하므로 대상이다.
# 예외는 config-server 하나다 — 기동 체인의 뿌리라 여기에 Kafka를 걸면 스택 전체 기동이
# Kafka 준비만큼 늦어지고, 설정 평면이 이벤트 평면에 종속된다. 발행자는 늦게 붙어도 무해하다.
x-depends-kafka: &depends-kafka
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

x-depends-db: &depends-db
  timescaledb:
    condition: service_healthy
    
services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: swtp-timescaledb
    environment:
      # POSTGRES_USER/POSTGRES_DB는 의도적으로 지정하지 않는다 — 기본값(postgres/postgres)
      # 컨텍스트에서 00-bootstrap.sql이 role(swtp_dba)/DB(swtp)를 만들어야
      # 운영 환경의 DBA 수동 실행 경로와 동일해진다.
      POSTGRES_PASSWORD: "swtp_local_dev"
    ports:
      - "15432:5432"
      - "15433:8081"
    volumes:
      - swtp-timescaledb-data:/home/postgres/pgdata/data
      # 부트스트랩 SSOT — docker 최초 기동 시 1회 자동 실행 (운영은 DBA가 동일 파일을 수동 실행)
      - ../postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready는 부트스트랩(init SQL) 실행 중에도 소켓 응답만으로 통과할 수 있다.
      # "부트스트랩 완료"를 실제 신호로 삼기 위해 스키마 생성 여부로 확인한다.
      test: ["CMD-SHELL", "psql -U swtp_dba -d swtp -tAc \"SELECT 1 FROM information_schema.schemata WHERE schema_name='master'\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    container_name: swtp-kafka
    environment:
      # KRaft single-node (broker + controller 겸용)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 분리: INTERNAL(컨테이너 간) / HOST(호스트에서 접속)
      # 브로커 포트는 어느 경로에서든 9092다 — 주소 차이는 호스트명뿐이다(kafka / localhost).
      # 컨테이너 안에서는 한 포트에 두 리스너를 바인딩할 수 없어 HOST를 9094에 두고,
      # 호스트에는 9092로 공개한다(ports 9092:9094).
      # ADVERTISED가 진짜 접속 주소다 — 클라이언트는 부트스트랩 후 여기로 재접속한다.
      # ports 매핑만 바꾸고 이 값을 9094로 두면 클라이언트가 다시 9094를 찾아가 실패한다.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 토픽은 kafka-init가 명시 생성한다 — 오타 토픽 자동 생성 방지
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      # 호스트 9092 → 컨테이너 HOST 리스너 9094. 앱 설정은 전 환경 9092 하나로 통일된다.
      - "9092:9094"
    healthcheck:
      # 컨테이너 안에서의 localhost:9092는 INTERNAL 리스너다 (호스트 공개 포트와 무관)
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: swtp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/swtp/create-topics.sh"]
    volumes:
      - ../kafka/create-topics.sh:/opt/swtp/create-topics.sh:ro
    restart: "no"

  # ── 플랫폼 앱: Core (항상 기동) ──────────────────────────────
  config-server:
    build:
      <<: *app-build
      args:
        APP: config-server
    container_name: swtp-config-server
    # 앵커(*app-env)를 쓰지 않는 유일한 앱이다 — SPRING_PROFILES_ACTIVE를 받으면
    # application.yml의 native(백엔드 지정)가 밀려나 Config Server 자체가 깨진다.
    # 그래서 필요한 변수만 직접 나열한다.
    environment:
      # native 백엔드가 마운트된 config-repo를 서빙한다
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: file:/config-repo
      SWTP_LOGGING_PATH: /logs
      # config-server는 자기가 서빙하는 config-repo를 자기는 읽지 않는다(spring.config.import 없음).
      # 이 한 줄이 없으면 다른 앱이 전부 전환돼도 config-server 로그만 기본값으로 남는다.
      SWTP_LOG_FORMAT: ${SWTP_LOG_FORMAT:-plain}
      # 정수장 식별자도 같은 이유로 여기에 따로 적는다 — 빠뜨리면 config-server 로그만
      # 사이트 식별자 없이 적재돼 중앙 집계에서 출처 미상 문서가 된다.
      SWTP_SITE_CODE: ${SWTP_SITE_CODE:-}
      # 같은 이유로 설정 전파(Config Bus)의 브로커 주소도 여기서 직접 준다.
      # 포트는 어디서나 9092지만 호스트명이 다르다 — 앱 yml 기본값 localhost는 컨테이너 안에서 자기 자신이다.
      # 이 값이 없으면 busrefresh를 쳐도 발행 자체가 실패한다.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8888:8888"
    volumes:
      - ../../config-repo:/config-repo:ro
      # 앵커(*app-logs)는 리스트 통째 치환이라 여기서는 항목을 직접 쓴다
      - ../../logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # 서비스 레지스트리 — 게이트웨이의 lb:// 라우팅이 여기서 대상 인스턴스를 찾는다.
  # 8761은 대시보드 확인용 노출이다. 외부에서 닿을 필요가 없는 내부 구성요소이므로
  # 운영 배포에서는 ports 블록을 지워 compose 네트워크 안에만 두는 것을 권한다.
  discovery-server:
    build:
      <<: *app-build
      args:
        APP: discovery-server
    container_name: swtp-discovery-server
    environment: *platform-app-env
    volumes: *app-logs
    ports:
      - "8761:8761"
    depends_on:
      <<: [*depends-config, *depends-kafka]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  gateway:
    build:
      <<: *app-build
      args:
        APP: gateway
    container_name: swtp-gateway
    environment: *platform-app-env
    volumes: *app-logs
    ports:
      - "8080:8080"
    # 업무 서비스는 server.port=0이라 compose가 내부 앱 포트를 직접 healthcheck하지 않는다.
    # 실제 준비 여부는 Eureka 등록 뒤 gateway 경유 actuator로 확인한다.
    depends_on:
      <<: [*depends-config, *depends-kafka]
      discovery-server:
        condition: service_healthy
      master-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      realtime-service:
        condition: service_started
      job-service:
        condition: service_started
      ems-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  master-service:
    build:
      <<: *app-build
      args:
        APP: master-service
    container_name: swtp-master-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-db, *depends-kafka]
  telemetry-service:
    build:
      <<: *app-build
      args:
        APP: telemetry-service
    container_name: swtp-telemetry-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-db, *depends-kafka]
  realtime-service:
    build:
      <<: *app-build
      args:
        APP: realtime-service
    container_name: swtp-realtime-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-kafka] # DB 미사용 — kafka 소비만
  job-service:
    build:
      <<: *app-build
      args:
        APP: job-service
    container_name: swtp-job-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-db, *depends-kafka]
  ems-service:
    build:
      <<: *app-build
      args:
        APP: ems-service
    container_name: swtp-ems-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      # depends-db 필수 — ems는 기동 시 Flyway가 ems 스키마에 V1을 적용해야 컨텍스트가 뜬다.
      # 빠지면 콜드 스타트에서 init SQL로 늦어진 DB보다 먼저 떠 커넥션 실패로 종료된다.
      <<: [*depends-config, *depends-db, *depends-kafka]

  # ── 플랫폼 앱: Optional (compose profiles — 정수장별 선택 배포) ──
  auth-service:
    profiles: ["auth", "full"]
    build:
      <<: *app-build
      args:
        APP: auth-service
    container_name: swtp-auth-service
    environment: *micro-app-env
    volumes: *app-logs
    # Phase 10에서 사용자/역할/리프레시토큰/서명키를 auth 스키마에 두게 되어 DB 의존이 생겼다
    depends_on:
      <<: [*depends-config, *depends-db, *depends-kafka]
  autonomous-service:
    profiles: ["autonomous", "full"]
    build:
      <<: *app-build
      args:
        APP: autonomous-service
    container_name: swtp-autonomous-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-kafka]
  pms-service:
    profiles: ["pms", "full"]
    build:
      <<: *app-build
      args:
        APP: pms-service
    container_name: swtp-pms-service
    environment: *micro-app-env
    volumes: *app-logs
    depends_on:
      <<: [*depends-config, *depends-kafka]
  ai-service:
    profiles: ["ai", "full"]
    build:
      context: ../../ai/ai-service
    container_name: swtp-ai-service
    # Spring 앱이 아니라 *app-env 앵커를 쓸 수 없다(SPRING_* 변수가 무의미).
    # 그래도 로그 계약은 같은 두 환경변수가 결정한다 — Java 11종과 필드가 어긋나면
    # Kibana에서 requestId 상관관계가 AI 구간에서 끊긴다.
    environment:
      SWTP_LOG_FORMAT: ${SWTP_LOG_FORMAT:-plain}
      SWTP_SITE_CODE: ${SWTP_SITE_CODE:-}
    ports:
      - "8000:8000"
    healthcheck:
      # slim 이미지에 curl이 없으므로 파이썬 표준 라이브러리로 확인
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # ── 관측 백엔드: ELK (compose profile "elk") ──────────────────
  # 앱 프로파일(auth/autonomous/pms/ai, 묶음 full)과는 다른 축이다 — full에 넣지 않는다.
  # full은 "Optional 앱 묶음"이고 ELK는 앱이 아니라 관측 백엔드다. 개발자가 스모크
  # 테스트로 --profile full을 칠 때 Elasticsearch까지 뜨면 단일 서버가 눌린다.
  #   관측 포함 기동: docker compose ... --profile elk up -d
  #
  # 중앙 집계로 전환하는 정수장은 이 프로파일을 켜지 않고, Beats의
  # SWTP_ELASTIC_HOSTS만 외부 주소로 바꾼다 — 코드 변경 0, .env 한 줄이다.
  elasticsearch:
    profiles: ["elk"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: swtp-elasticsearch
    environment:
      node.name: swtp-es
      discovery.type: single-node
      # 폐쇄망 단일 서버 전제로 보안을 끈다 — 부트스트랩 토큰/자체서명 TLS/자격증명
      # 배선이 전부 사라져 구성이 단순해진다. 대신 9200을 호스트에 공개하지 않는다(아래 ports).
      # ⚠ 중앙 집계로 전환하면 ES가 정수장 밖으로 노출되므로 반드시 다시 켠다.
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # 힙은 컨테이너 가용 메모리의 절반을 자동 산정하는데, 단일 서버에 앱 11종 +
      # Kafka + TimescaleDB가 이미 올라가 있어 자동값이 과하다. 명시 고정한다.
      ES_JAVA_OPTS: "${SWTP_ES_HEAP:--Xms1g -Xmx1g}"
      # 힙을 스왑으로 밀어내면 GC 지연이 수초 단위가 된다 — memlock으로 고정한다.
      bootstrap.memory_lock: "true"
      # 폐쇄망이라 GeoIP DB를 받아올 수 없다. 끄지 않으면 기동 후 주기적으로 실패 로그가 쌓인다.
      ingest.geoip.downloader.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - swtp-elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      # 루프백에만 공개한다 — 인증이 없으므로 정수장 내부망에도 열지 않는다.
      # 운영자가 서버에 직접 붙어 curl로 확인하는 용도다.
      - "127.0.0.1:9200:9200"
    healthcheck:
      # 단일 노드는 복제본을 배치할 곳이 없어 yellow가 정상이다 — green만 통과시키면 영원히 대기한다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    profiles: ["elk"]
    image: docker.elastic.co/kibana/kibana:9.4.5
    container_name: swtp-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_PUBLICBASEURL: "${SWTP_KIBANA_PUBLIC_URL:-http://localhost:5601}"
    ports:
      # ES와 달리 운영자 브라우저가 붙어야 하므로 정수장 내부망에 공개한다.
      # 인증이 없는 상태이므로 외부망 노출은 방화벽에서 차단해야 한다.
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  # 인덱스 보존 정책을 박는다 — kafka-init와 같은 자리의 1회성 초기화 컨테이너다.
  # Beats가 자동 생성하는 기본 ILM에는 delete 단계가 없어 인덱스가 무한히 자란다.
  # Beats는 정책이 이미 있으면 덮어쓰지 않으므로 반드시 Beats보다 먼저 돌아야 한다.
  elk-init:
    profiles: ["elk"]
    # curl이 있고 이미 받아 둔 이미지를 재사용한다 — 초기화 하나 때문에 이미지를 더 받지 않는다.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: swtp-elk-init
    entrypoint: ["/bin/bash", "/opt/swtp/init-ilm.sh"]
    environment:
      SWTP_ELASTIC_HOSTS: "${SWTP_ELASTIC_HOSTS:-http://elasticsearch:9200}"
      SWTP_LOG_RETENTION_DAYS: "${SWTP_LOG_RETENTION_DAYS:-30}"
      SWTP_LOG_MAX_SHARD_SIZE: "${SWTP_LOG_MAX_SHARD_SIZE:-5gb}"
    volumes:
      - ../elasticsearch/init-ilm.sh:/opt/swtp/init-ilm.sh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  filebeat:
    profiles: ["elk"]
    image: docker.elastic.co/beats/filebeat:9.4.5
    container_name: swtp-filebeat
    # docker.sock과 컨테이너 로그 디렉토리를 읽으려면 root여야 한다.
    user: root
    # --strict.perms=false: Beats는 설정 파일이 그룹/타인 쓰기 가능하면 기동을 거부하는데,
    #   bind mount된 파일의 권한은 호스트 파일시스템이 정한다(Windows에서는 항상 걸린다).
    # ⚠ 8.x 시절의 `-environment container`를 함께 적으면 안 된다 — 9.x에서 제거돼
    #   `unknown command "container"`로 즉시 종료한다. compose up은 성공으로 끝나고
    #   컨테이너만 조용히 사라지므로 ps 목록을 세어 보지 않으면 놓친다.
    command: ["--strict.perms=false"]
    environment:
      SWTP_ELASTIC_HOSTS: "${SWTP_ELASTIC_HOSTS:-http://elasticsearch:9200}"
      SWTP_KIBANA_HOST: "${SWTP_KIBANA_HOST:-http://kibana:5601}"
      SWTP_SITE_CODE: "${SWTP_SITE_CODE:-unknown}"
    volumes:
      # ⚠ 마운트 경로는 이미지가 읽는 경로와 정확히 같아야 한다 (step-16 함정 #1)
      - ../filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker json-file 드라이버가 컨테이너 로그를 쓰는 실제 경로.
      # 다른 로깅 드라이버(local 등)로 바꾸면 이 경로가 비어 수집이 조용히 멈춘다.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - swtp-filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      # 기동 시 Kibana에 데이터 뷰를 만들므로 Kibana가 준비된 뒤에 뜬다
      kibana:
        condition: service_healthy
      # 보존 정책이 먼저 박혀야 한다 — Beats는 정책이 있으면 덮어쓰지 않는다
      elk-init:
        condition: service_completed_successfully

  metricbeat:
    profiles: ["elk"]
    image: docker.elastic.co/beats/metricbeat:9.4.5
    container_name: swtp-metricbeat
    user: root
    command: ["--strict.perms=false"]
    environment:
      SWTP_ELASTIC_HOSTS: "${SWTP_ELASTIC_HOSTS:-http://elasticsearch:9200}"
      SWTP_KIBANA_HOST: "${SWTP_KIBANA_HOST:-http://kibana:5601}"
      SWTP_SITE_CODE: "${SWTP_SITE_CODE:-unknown}"
    volumes:
      - ../metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - swtp-metricbeat-data:/usr/share/metricbeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      # 기동 시 Kibana에 기본 대시보드를 적재하므로 Kibana가 준비된 뒤에 뜬다.
      kibana:
        condition: service_healthy
      elk-init:
        condition: service_completed_successfully

# 데이터는 named volume(Docker가 수명주기 관리), 로그는 bind mount(호스트에서 직접 열람) — 용도별 분리
volumes:
  swtp-timescaledb-data:
  # ELK 프로파일 전용 — 색인 데이터와 Beats의 수집 위치(registry).
  # registry를 볼륨에 두지 않으면 Beats 재시작마다 로그를 처음부터 다시 읽어 중복 적재된다.
  swtp-elasticsearch-data:
  swtp-filebeat-data:
  swtp-metricbeat-data:
