# [임시 검증용 override] 호스트 포트 게시만 제거한다.
#
# Windows가 TCP 7981-8380을 동적 예약해(netsh interface ipv4 show excludedportrange protocol=tcp)
# 앱 포트(8080~8088) 게시가 거부되는 개발 PC에서 전체 스택을 기동해 검증하기 위한 파일이다.
# 컨테이너 내부 포트와 컨테이너 간 통신은 예약의 영향을 받지 않으므로,
# 게시를 빼면 docker 네트워크 안에서는 정상 동작을 그대로 확인할 수 있다.
#
#   docker compose -f compose.yaml -f compose.no-publish.yaml --profile auth up -d --build
#   docker run --rm --network swtp-platform_default curlimages/curl -s http://gateway:8080/...
#
# 포트 예약이 해소되면(관리자 권한: net stop winnat && net start winnat) 이 파일 없이 기동한다.
services:
  gateway:
    ports: !reset []
  master-service:
    ports: !reset []
  telemetry-service:
    ports: !reset []
  realtime-service:
    ports: !reset []
  job-service:
    ports: !reset []
  auth-service:
    ports: !reset []
