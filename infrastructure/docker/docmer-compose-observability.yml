services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=3s > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.5
    container_name: logstash
    volumes:
      - swtp-log-vol:/logs:ro
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf #logstash config file
      - logstash-data:/usr/share/logstash/data # real Vol
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines/main > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.5 
    container_name: kibana
    ports:
      - "5601:5601" # 키바나 포트 번호
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

networks:
  default:
    name: swtp-platform
    external: true

volumes:
  swtp-log-vol:
    external: true
  logstash-data:
