# apps/*/build/libs 의 bootJar 산출물로 앱별 이미지를 빌드해서 실행하는 개발용 compose.
# 사전 조건:
#   ./gradlew bootJar
# 기동:
#   docker compose -f infrastructure/docker/compose-dev.yaml up -d --build
#
# PostgreSQL은 이 파일에서 띄우지 않는다. 로컬/외부 인스턴스를 바라본다.
# Kafka는 같은 compose 안에서 띄우고 앱 컨테이너는 kafka:9092로 접근한다.

name: swtp-platform

x-app-env: &app-env
  CONFIG_SERVER_URI: http://config-server:8888
  SWTP_LOGGING_PATH: /logs
  SWTP_LOG_FORMAT: ${SWTP_LOG_FORMAT:-plain}
  SWTP_SITE_CODE: ${SWTP_SITE_CODE:-}
  # 리터럴로 박지 않는다 — "정수장별 차이는 환경변수 한 줄"이 dev에서만 깨지면
  # 이 파일로 배포하는 개발서버가 인증 모드를 한 번도 태워 보지 못한다.
  SWTP_AUTH_MODE: ${SWTP_AUTH_MODE:-none}
  SWTP_DISCOVERY_URI: http://discovery-server:8761/eureka/
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: true
  # 경로는 게이트웨이 라우트 규약(/{서비스명}/**)을 따른다 — 라우트 접두사를 바꾸면 여기도 바뀐다.
  SWTP_AUTH_JWKS_URI: ${SWTP_AUTH_JWKS_URI:-http://gateway:8080/auth-service/api/auth/.well-known/jwks.json}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

x-platform-app-env: &platform-app-env
  <<: *app-env
  SPRING_PROFILES_ACTIVE: dev,docker

x-micro-app-env: &micro-app-env
  <<: *app-env
  SPRING_PROFILES_ACTIVE: dev,docker,micro
  SWTP_DB_HOST: ${SWTP_DB_HOST:-host.docker.internal}
  SWTP_DB_PORT: ${SWTP_DB_PORT:-15432}

x-app-base: &app-base
  build:
    context: ../..
    dockerfile: infrastructure/docker/app.Dockerfile

x-log-volume: &log-volume swtp-log-vol:/logs

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  config-server:
    <<: *app-base
    image: config-server:dev
    container_name: config-server
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: config-server
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: file:/workspace/config-repo
      SWTP_LOGGING_PATH: /logs
      SWTP_LOG_FORMAT: ${SWTP_LOG_FORMAT:-plain}
      SWTP_SITE_CODE: ${SWTP_SITE_CODE:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports:
      - "38888:8888"
    volumes:
      - ../../config-repo:/workspace/config-repo:ro
      - *log-volume
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  discovery-server:
    <<: *app-base
    image: discovery-server:dev
    container_name: discovery-server
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: discovery-server
    environment: *platform-app-env
    ports:
      - "38761:8761"
    volumes:
      - *log-volume
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      config-server:
        condition: service_healthy

  gateway:
    <<: *app-base
    image: gateway:dev
    container_name: gateway
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: gateway
    environment: *platform-app-env
    ports:
      - "38080:8080"
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  master-service:
    <<: *app-base
    image: master-service:dev
    container_name: master-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: master-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  telemetry-service:
    <<: *app-base
    image: telemetry-service:dev
    container_name: telemetry-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: telemetry-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  realtime-service:
    <<: *app-base
    image: realtime-service:dev
    container_name: realtime-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: realtime-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  job-service:
    <<: *app-base
    image: job-service:dev
    container_name: job-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: job-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  auth-service:
    <<: *app-base
    image: auth-service:dev
    container_name: auth-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: auth-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  autonomous-service:
    <<: *app-base
    image: autonomous-service:dev
    container_name: autonomous-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: autonomous-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  ems-service:
    <<: *app-base
    image: ems-service:dev
    container_name: ems-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: ems-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  pms-service:
    <<: *app-base
    image: pms-service:dev
    container_name: pms-service
    build:
      context: ../..
      dockerfile: infrastructure/docker/app.Dockerfile
      args:
        APP: pms-service
    environment:
      <<: *micro-app-env
    volumes:
      - *log-volume
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

networks:
  default:
    name: swtp-platform
    external: true

volumes:
  swtp-log-vol:
    external: true
